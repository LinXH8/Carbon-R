# Local Postgres, as an alternative to a hosted database.
#
# Carbon R currently runs against Supabase (see .env), but Tier 2's done-check requires the
# repo to come up from a fresh `git clone` + `docker compose up`, so the local path is kept
# working. pgvector is in the image from the start because Tier 2 Block 4 embeds the
# methodology corpus into the same database the factors live in.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: carbon_r
      POSTGRES_PASSWORD: carbon_r
      POSTGRES_DB: carbon_r
    ports:
      # 5433 on the host: leaves a system Postgres on 5432 undisturbed.
      - "5433:5432"
    volumes:
      - carbon_r_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon_r -d carbon_r"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carbon_r_pgdata:
