# Carbon R from a fresh clone: `docker compose up`, then http://localhost:8000.
#
# The stack runs its own Postgres (with pgvector) and seeds the emission factors on start;
# no hosted database is needed. The only thing a fresh clone must supply is an OpenAI key,
# in a `.env` beside this file - and even without one the stack starts and says what is
# missing (`/health`).

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: carbon_r
      POSTGRES_PASSWORD: carbon_r
      POSTGRES_DB: carbon_r
    ports:
      # 5433 on the host: leaves a system Postgres on 5432 undisturbed.
      - "5433:5432"
    volumes:
      - carbon_r_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbon_r -d carbon_r"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Always the stack's own database, even if a developer's .env points at a hosted one.
      DATABASE_URL: postgresql://carbon_r:carbon_r@db:5432/carbon_r
      # The project's pinned snapshots. config.py has no defaults on purpose (a model id
      # must be one the billed account has); these are the ids the README's numbers were
      # measured with. Override either in the shell or .env.
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini-2026-03-17}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      # The GHG Protocol PDFs, if downloaded (README "Methodology corpus"). Read-only.
      - ./data/raw:/app/data/raw:ro
      - carbon_r_uploads:/app/data/uploads

volumes:
  carbon_r_pgdata:
  carbon_r_uploads:
