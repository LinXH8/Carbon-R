<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carbon R</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<!-- A translucent layer with content scrolling under it, not an opaque strip that eats
     a band of the viewport. The scroll edge is a gradient mask in app.css, not a rule. -->
<header class="bar">
  <h1>Carbon R</h1>
  <p class="bar-note">Every number is computed in Python and carries its source.</p>
</header>

<main>
  <!-- 1. The document -------------------------------------------------------------- -->
  <section class="card dropzone" id="dropzone" tabindex="0" role="button"
           aria-label="Choose or drop an electricity bill">
    <svg class="dropzone-glyph" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 16V4m0 0L8 8m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg>
    <p class="dropzone-title">Drop an electricity bill</p>
    <p class="dropzone-hint">PDF, PNG or JPEG, up to 10 MB. Nothing leaves this machine
      except the page image sent to the model.</p>
    <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg" hidden>
  </section>

  <ul class="chips" id="docs" aria-label="Uploaded documents"></ul>

  <!-- 2. The question ------------------------------------------------------------- -->
  <section class="card ask" hidden id="ask-card">
    <label class="label" for="question">Question</label>
    <textarea id="question" rows="3" spellcheck="false">What are the Scope 2 emissions for this electricity bill? Show the factor you used and where it comes from.</textarea>
    <div class="ask-row">
      <button class="button primary" id="ask">Ask</button>
      <span class="ask-note" id="ask-note"></span>
    </div>
  </section>

  <!-- 3. What the agent is doing, as it does it ----------------------------------- -->
  <ol class="steps" id="steps" aria-live="polite" aria-label="Tool calls"></ol>

  <!-- 4. The answer, rendered from the structured figure and never from the prose -- -->
  <div id="answer"></div>
</main>

<!-- The full transcript lives in a sheet you pull up. It is the one surface here that is
     directly manipulated, so it is the one that gets springs, momentum and rubber-banding. -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" aria-label="Audit trail" aria-hidden="true" hidden>
  <div class="grabber" id="grabber" role="separator" aria-label="Drag to resize"></div>
  <header class="sheet-head">
    <h2>Audit trail</h2>
    <button class="button" id="sheet-close">Done</button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script type="module" src="/static/app.js"></script>
</body>
</html>
